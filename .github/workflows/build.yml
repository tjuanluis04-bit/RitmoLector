name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la carpeta android
        run: |
          flutter create --platforms=android --project-name ritmo --org com.ritmo.lectura "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android
          sed -i 's/android:label="[^"]*"/android:label="Ritmo"/' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar iconos
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
